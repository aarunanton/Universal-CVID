<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>CV Builder | Universal CV ID</title>
<meta name="description" content="Free online CV builder. Build, tailor and download your CV as PDF or Word, and track your job applications. No sign-up.">
<link rel="canonical" href="https://cvid.app/app.html">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<script src="assets/boot.js?v=26"></script>
<link rel="stylesheet" href="assets/fonts/fonts.css?v=26">
<link rel="stylesheet" href="assets/styles.css?v=26">
<script src="assets/vendor/lz-string.min.js?v=26"></script>
<script src="assets/vendor/qrcode.min.js?v=26"></script>
<script src="assets/vendor/jspdf.umd.min.js?v=26"></script>
</head>
<body>
  <header class="app-bar">
    <div class="app-bar-inner">
      <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"></span>Universal CV ID<span class="beta-tag">Beta</span></a>
      <span class="save-state" id="saveState" aria-live="polite">Saved</span>
      <span class="spacer"></span>
      <div class="version-picker">
        <button class="ver-chip" data-tab="home" title="Back to the dashboard"><span class="sw">← Dashboard</span><span class="eyebrow">Editing</span><b id="verName">Main CV</b></button>
        <select id="versionSelect" class="sr" tabindex="-1" aria-hidden="true"></select>
      </div>
      <div class="pv-size" role="group" aria-label="Preview size"><span>Preview</span><button type="button" data-action="pv-size" data-size="small" aria-pressed="true">Small</button><button type="button" data-action="pv-size" data-size="large" aria-pressed="false">Large</button><button type="button" data-action="pv-size" data-size="hidden" aria-pressed="false">Hidden</button></div>
      <a class="fb-link" href="https://tally.so/r/1A11el" target="_blank" rel="noopener" title="Give feedback: 2-minute anonymous survey" aria-label="Give feedback"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg><span>Feedback</span></a>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Main"></nav>
    <nav class="subtabs" id="subtabs" role="tablist" aria-label="In this area" hidden></nav>
  </header>

  <div class="workspace">
    <main id="panel" class="panel-col" role="tabpanel"></main>

    <aside class="preview-col" aria-label="Live preview">
      <div class="preview-bar">
        <span class="eyebrow" id="pageCount">Live preview · A4</span>
        <button class="btn btn-sm panel-toggle" data-action="toggle-panel">Hide panel</button>
        <button class="btn btn-sm btn-primary" data-action="download-main">Download PDF</button>
      </div>
      <div class="paper-wrap" id="paperWrap"><div class="paper-scale" id="paper"></div></div>
    </aside>
  </div>

  <button class="fab" id="previewFab" data-action="toggle-preview" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span>Preview</span></button>

  <div class="toast-wrap" id="toasts" aria-live="polite"></div>

  <script src="assets/cv.js?v=26"></script>
  <script src="assets/app.js?v=26"></script>
<!-- Cloudflare Web Analytics: anonymous visit counts, no cookies. Not loaded on share pages (p.html). --><script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "1879d12eedaf4b739530700ef3285989"}'></script>
</body>
</html>
