<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Universal CV ID Studio</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<script src="assets/boot.js?v=6"></script>
<link rel="stylesheet" href="assets/fonts/fonts.css?v=6">
<link rel="stylesheet" href="assets/styles.css?v=6">
<script src="assets/vendor/lz-string.min.js?v=6"></script>
<script src="assets/vendor/qrcode.min.js?v=6"></script>
<script src="assets/vendor/jspdf.umd.min.js?v=6"></script>
</head>
<body>
  <header class="app-bar">
    <div class="app-bar-inner">
      <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"></span>Universal CV ID</a>
      <button class="id-chip" id="idChip" data-action="copy-id" title="Copy your ID">#UCVID-·····</button>
      <span class="save-state" id="saveState" aria-live="polite">Saved</span>
      <span class="spacer"></span>
      <div class="version-picker">
        <label for="versionSelect" class="eyebrow">Version</label>
        <select id="versionSelect"></select>
        <button class="btn btn-sm" data-action="new-version" title="Copy this version into a new one">+ New</button>
      </div>
      <button class="btn btn-ghost btn-sm" data-action="theme" aria-label="Switch light or dark mode">◐</button>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
  </header>

  <div class="workspace">
    <main id="panel" class="panel-col" role="tabpanel"></main>

    <aside class="preview-col" aria-label="Live preview">
      <div class="preview-bar">
        <span class="eyebrow" id="pageCount">Live preview · A4</span>
        <button class="btn btn-sm" data-tab="design">Design</button>
        <button class="btn btn-sm btn-primary" data-action="download-main">Download PDF</button>
      </div>
      <div class="paper-wrap" id="paperWrap"><div class="paper-scale" id="paper"></div></div>
    </aside>
  </div>

  <button class="fab" id="previewFab" data-action="toggle-preview" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span>Preview</span></button>

  <div class="toast-wrap" id="toasts" aria-live="polite"></div>

  <script src="assets/cv.js?v=6"></script>
  <script src="assets/app.js?v=6"></script>
</body>
</html>
