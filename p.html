<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Universal CV ID Profile</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="public-wrap">
    <div class="public-bar">
      <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"></span>Universal CV ID</a>
      <span class="spacer"></span>
      <span id="actions" class="row"></span>
    </div>
    <main id="out"></main>
    <p class="hint">This profile is stored inside the link itself. <a href="app.html">Create your own Universal CV ID</a>, free.</p>
  </div>
  <div class="toast-wrap" id="toasts" aria-live="polite"></div>

  <script src="assets/cv.js"></script>
  <script>
    addEventListener('hashchange', () => location.reload());
    (function () {
      const { esc } = UCV;
      const out = document.getElementById('out');
      const actions = document.getElementById('actions');
      const data = UCV.decode(location.hash.slice(1));
      const toast = (m) => { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.getElementById('toasts').appendChild(t); setTimeout(() => t.remove(), 2500); };

      if (!data || !data.id) {
        out.innerHTML = '<div class="contact-card"><h1 style="font:700 24px/1.2 var(--display)">This link is incomplete</h1><p style="color:var(--ink-2)">Profile links are long. Ask the sender to copy the whole link again.</p><a class="btn btn-primary" href="app.html">Create your own CV ID</a></div>';
        return;
      }
      document.title = (data.t === 'card' ? data.n : data.cv?.basics?.name || 'Profile') + ' · ' + data.id;

      if (data.t === 'card') {
        const [l1, l2] = UCV.mrz(data.id, data.n, data.l);
        const initials = (data.n || '?').split(/\s+/).map(s => s[0]).slice(0, 2).join('').toUpperCase();
        const rows = [['Email', data.e], ['Phone', data.p], ['Location', data.loc], ['Web', data.u]].filter(r => r[1]);
        out.innerHTML = `
          <div class="contact-card">
            <div class="idcard">
              <div class="idcard-top"><span>Universal CV ID</span><span>Contact</span></div>
              <div class="idcard-body"><div class="idcard-photo" aria-hidden="true">${esc(initials)}</div>
                <div style="min-width:0"><div class="idcard-name">${esc(data.n)}</div><div class="idcard-label">${esc(data.l)}</div><div class="idcard-id">${esc(data.id)}</div></div></div>
              <div class="idcard-mrz" aria-hidden="true">${esc(l1)}\n${esc(l2)}</div>
            </div>
            <dl>${rows.map(r => `<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl>
            ${data.e ? `<button class="btn btn-primary" id="copyEmail">Copy email address</button>` : ''}
          </div>`;
        document.getElementById('copyEmail')?.addEventListener('click', async () => {
          try { await navigator.clipboard.writeText(data.e); toast('Email copied'); } catch (e) { toast(data.e); }
        });
        return;
      }

      const version = { cv: Object.assign(UCV.blankCV(), data.cv), template: data.tpl || 'meridian', accent: data.ac, order: data.ord || UCV.DEFAULT_ORDER, name: 'CV' };
      version.cv.basics = Object.assign(UCV.blankCV().basics, version.cv.basics);
      out.innerHTML = `<div class="paper-wrap" id="paperWrap"><div class="paper-scale" id="paper">${UCV.renderCV(version, data.id)}</div></div>`;
      actions.innerHTML = '<button class="btn btn-primary btn-sm" id="dl">Download PDF</button>';
      document.getElementById('dl').addEventListener('click', () => { if (window.jspdf) UCV.pdf({ id: data.id }, version); });

      const fit = () => {
        const wrap = document.getElementById('paperWrap'), paper = document.getElementById('paper');
        const s = Math.min(1, (wrap.clientWidth - 36) / 794);
        paper.style.transform = `scale(${s})`; paper.style.width = 794 * s + 'px';
        paper.style.height = paper.firstElementChild.offsetHeight * s + 'px';
      };
      fit(); addEventListener('resize', fit); document.fonts?.ready.then(fit);
    })();
  </script>
</body>
</html>
